[tools]
node = "24"
"npm:pnpm" = "11"

[tasks.build]
dir = "{{config_root}}"
run = "pnpm run build"

[tasks.typecheck]
dir = "{{config_root}}"
run = "pnpm run typecheck"

[tasks.format]
dir = "{{config_root}}"
run = "pnpm run format"

[tasks.format-check]
dir = "{{config_root}}"
run = "pnpm run format-check"

[tasks.lint]
dir = "{{config_root}}"
run = "pnpm run lint"

[tasks.lint-fix]
dir = "{{config_root}}"
run = "pnpm run lint-fix"

[tasks.check]
dir = "{{config_root}}"
run = "pnpm run check"

[tasks.test]
dir = "{{config_root}}"
run = "pnpm run test"

[tasks.local-ci]
depends = ["build", "typecheck", "format-check", "lint", "test"]
