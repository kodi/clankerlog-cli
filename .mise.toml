[tools]
node = "24"
"npm:pnpm" = "11"

[tasks.build]
dir = "{{config_root}}"
run = "node_modules/.bin/tsdown"

[tasks.typecheck]
dir = "{{config_root}}"
run = "node_modules/.bin/tsgo --noEmit"

[tasks.format]
dir = "{{config_root}}"
run = "node_modules/.bin/oxfmt . --write"

[tasks.format-check]
dir = "{{config_root}}"
run = "node_modules/.bin/oxfmt . --check"

[tasks.lint]
dir = "{{config_root}}"
run = "node_modules/.bin/oxlint src --deny-warnings"

[tasks.lint-fix]
dir = "{{config_root}}"
run = "node_modules/.bin/oxlint src --fix"

[tasks.check]
depends = ["lint", "format-check", "typecheck"]

[tasks.test]
dir = "{{config_root}}"
run = "node_modules/.bin/vitest run"

[tasks.local-ci]
depends = ["build", "typecheck", "format-check", "lint", "test"]
